<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Jesus David Peña — Si lo haces dos veces, que lo haga un flujo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="1" stop-color="#071908"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#80C41C" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="16" fill="url(#grid)"/>

  <!-- flujo: nodos conectados -->
  <g fill="none" stroke="#B3B3B3" stroke-opacity="0.35" stroke-width="2">
    <path d="M820 90 C880 90 880 150 940 150"/>
    <path d="M820 210 C880 210 880 150 940 150"/>
    <path d="M1000 150 H1060"/>
  </g>
  <g>
    <rect x="770" y="70" width="50" height="40" rx="8" fill="#071908" stroke="#B3B3B3" stroke-opacity="0.5"/>
    <rect x="770" y="190" width="50" height="40" rx="8" fill="#071908" stroke="#B3B3B3" stroke-opacity="0.5"/>
    <rect x="940" y="125" width="60" height="50" rx="10" fill="#071908" stroke="#80C41C" stroke-width="2"/>
    <circle cx="1080" cy="150" r="18" fill="#80C41C"/>
    <path d="M1072 150 l6 6 l10 -12" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g font-family="'Segoe UI', Montserrat, Helvetica, Arial, sans-serif">
    <text x="64" y="118" fill="#FFFFFF" font-size="48" font-weight="700">Jesus David Peña</text>
    <text x="64" y="160" fill="#B3B3B3" font-size="22">Ingeniero de sistemas · automatización · datos · agentes IA</text>
    <rect x="64" y="196" width="6" height="34" fill="#80C41C"/>
    <text x="84" y="221" fill="#80C41C" font-size="24" font-style="italic">Si lo haces dos veces, que lo haga un flujo.</text>
  </g>
</svg>
